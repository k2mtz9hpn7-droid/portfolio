<rect x="60" y="170" width="1080" height="64" fill="#171815"/><text x="80" y="211" font-size="22" font-weight="700" fill="#fff">阶段</text><text x="274.4" y="211" font-size="22" font-weight="700" fill="#fff">满减设置</text><text x="620" y="211" font-size="22" font-weight="700" fill="#fff">客单价</text><text x="814.4" y="211" font-size="22" font-weight="700" fill="#fff">判断</text><rect x="60" y="234" width="1080" height="62" fill="#ffffff" stroke="#d8d8cf" stroke-width="1"/><text x="80" y="274" font-size="21" fill="#171815">优化前</text><text x="274.4" y="274" font-size="21" fill="#171815">满 30 减 5</text><text x="620" y="274" font-size="21" fill="#171815">31 元</text><text x="814.4" y="274" font-size="21" fill="#171815">门槛偏低，凑单动力弱</text><rect x="60" y="296" width="1080" height="62" fill="#f6f6f0" stroke="#d8d8cf" stroke-width="1"/><text x="80" y="336" font-size="21" fill="#171815">优化后</text><text x="274.4" y="336" font-size="21" fill="#171815">满 35 减 6 + 凑单小食</text><text x="620" y="336" font-size="21" fill="#171815">36.5 元</text><text x="814.4" y="336" font-size="21" fill="#171815">客单价 +5.5 元</text>
